<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- PWA 配置 -->
    <link rel="manifest" href="/manifest.json?v=4" />
    <meta name="theme-color" content="#FF7B54" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#E86640" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="/icons/icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="96x96" href="/icons/icon-96x96.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="/icons/icon-128x128.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144x144.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="384x384" href="/icons/icon-384x384.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512x512.png" />
    
    <!-- PWA 启动画面 - iOS -->
    <link rel="apple-touch-startup-image" href="/icons/icon-512x512.png" />
    
    <!-- 应用名称 -->
    <meta name="apple-mobile-web-app-title" content="数学游戏" />
    <meta name="application-name" content="数学游戏" />
    
    <!-- 预连接优化 -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

    <!-- 中文优先字体 - 使用系统字体栈，无需外部 CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">

    <title>数学运算游戏</title>
    <script>
      // 禁止移动端缩放 - iOS Safari 和 Android Chrome 兼容
      (function() {
        // 阻止双击缩放
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
          const now = Date.now();
          if (now - lastTouchEnd <= 300) {
            event.preventDefault();
          }
          lastTouchEnd = now;
        }, false);

        // 阻止双指缩放
        document.addEventListener('touchstart', function(event) {
          if (event.touches.length > 1) {
            event.preventDefault();
          }
        }, { passive: false });

        // 阻止手势缩放
        document.addEventListener('gesturestart', function(event) {
          event.preventDefault();
        });

        document.addEventListener('gesturechange', function(event) {
          event.preventDefault();
        });

        document.addEventListener('gestureend', function(event) {
          event.preventDefault();
        });

        // 阻止 Ctrl/Cmd + 滚轮缩放
        document.addEventListener('wheel', function(event) {
          if (event.ctrlKey || event.metaKey) {
            event.preventDefault();
          }
        }, { passive: false });

        // 阻止键盘缩放快捷键
        document.addEventListener('keydown', function(event) {
          if ((event.ctrlKey || event.metaKey) &&
              (event.key === '+' || event.key === '-' || event.key === '0')) {
            event.preventDefault();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
