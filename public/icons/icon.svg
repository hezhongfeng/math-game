<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 粘土质感渐变 - 温和绿色 -->
    <linearGradient id="clayBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7BB383"/>
      <stop offset="50%" style="stop-color:#5D9A6E"/>
      <stop offset="100%" style="stop-color:#3A6347"/>
    </linearGradient>
    
    <!-- 数字高光渐变 -->
    <linearGradient id="numberHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8E8E8"/>
    </linearGradient>
    
    <!-- 内阴影滤镜 -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="2" dy="2" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
    
    <!-- 粘土阴影 -->
    <filter id="clayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2F4F39" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- 主背景 - 粘土质感圆角矩形 -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#clayBg)" filter="url(#clayShadow)"/>
  
  <!-- 内部高光层 -->
  <rect x="24" y="24" width="464" height="232" rx="100" fill="rgba(255,255,255,0.15)"/>
  
  <!-- 边框高光 - 厚边框效果 -->
  <rect x="24" y="24" width="464" height="464" rx="100" 
        fill="none" 
        stroke="rgba(255,255,255,0.3)" 
        stroke-width="3"/>
  
  <!-- 主要数字 "123" - 粘土立体感 -->
  <text x="256" y="310" 
        font-family="Arial Rounded MT Bold, Arial, sans-serif" 
        font-size="190" 
        font-weight="900" 
        fill="url(#numberHighlight)"
        text-anchor="middle"
        filter="url(#innerShadow)"
        letter-spacing="-8">123</text>
  
  <!-- 数字底部阴影 - 增强3D感 -->
  <text x="258" y="312" 
        font-family="Arial Rounded MT Bold, Arial, sans-serif" 
        font-size="190" 
        font-weight="900" 
        fill="rgba(0,0,0,0.1)"
        text-anchor="middle"
        letter-spacing="-8">123</text>
  
  <!-- 数字主体（覆盖在上面） -->
  <text x="256" y="310" 
        font-family="Arial Rounded MT Bold, Arial, sans-serif" 
        font-size="190" 
        font-weight="900" 
        fill="url(#numberHighlight)"
        text-anchor="middle"
        letter-spacing="-8">123</text>
</svg>
