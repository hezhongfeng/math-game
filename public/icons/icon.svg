<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5D9A6E"/>
      <stop offset="100%" style="stop-color:#3A6347"/>
    </linearGradient>
    <linearGradient id="numberGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F7DC6F"/>
      <stop offset="100%" style="stop-color:#F4D03F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000" flood-opacity="0.1"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="512" height="512" fill="url(#bgGradient)" rx="100" ry="100"/>
  
  <!-- 内部高光边框 -->
  <rect x="12" y="12" width="488" height="488" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="6" rx="92" ry="92"/>
  
  <!-- 数字 1 -->
  <g filter="url(#shadow)">
    <text x="140" y="200" font-family="Arial, sans-serif" font-size="140" font-weight="bold" fill="url(#numberGradient)" text-anchor="middle">1</text>
  </g>
  
  <!-- 加号 -->
  <g filter="url(#shadow)">
    <text x="256" y="310" font-family="Arial, sans-serif" font-size="200" font-weight="bold" fill="white" text-anchor="middle">+</text>
  </g>
  
  <!-- 数字 2 -->
  <g filter="url(#shadow)">
    <text x="372" y="400" font-family="Arial, sans-serif" font-size="140" font-weight="bold" fill="url(#numberGradient)" text-anchor="middle">2</text>
  </g>
  
  <!-- 装饰性小星星 -->
  <circle cx="80" cy="420" r="12" fill="#F4D03F" opacity="0.8"/>
  <circle cx="432" cy="100" r="8" fill="#F4D03F" opacity="0.6"/>
  <circle cx="460" cy="380" r="6" fill="white" opacity="0.4"/>
</svg>