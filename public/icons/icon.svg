<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6BA3E8"/>
      <stop offset="100%" style="stop-color:#4A90E2"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" ry="128" fill="url(#bgGradient)"/>
  
  <!-- Calculator Icon -->
  <g fill="white" transform="translate(128, 128) scale(10.67)">
    <!-- Calculator body -->
    <rect x="2" y="2" width="20" height="24" rx="2" ry="2" fill="white"/>
    <!-- Screen -->
    <rect x="5" y="5" width="14" height="5" rx="1" ry="1" fill="#4A90E2"/>
    <!-- Buttons -->
    <rect x="5" y="13" width="3" height="3" rx="0.5" ry="0.5" fill="#4A90E2"/>
    <rect x="10" y="13" width="3" height="3" rx="0.5" ry="0.5" fill="#4A90E2"/>
    <rect x="15" y="13" width="3" height="3" rx="0.5" ry="0.5" fill="#4A90E2"/>
    <rect x="5" y="18" width="3" height="3" rx="0.5" ry="0.5" fill="#4A90E2"/>
    <rect x="10" y="18" width="3" height="3" rx="0.5" ry="0.5" fill="#4A90E2"/>
    <rect x="15" y="18" width="3" height="3" rx="0.5" ry="0.5" fill="#4A90E2"/>
  </g>
</svg>