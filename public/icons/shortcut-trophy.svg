<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="clayBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7BB383"/>
      <stop offset="50%" style="stop-color:#5D9A6E"/>
      <stop offset="100%" style="stop-color:#3A6347"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2F4F39" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <rect x="4" y="4" width="88" height="88" rx="22" fill="url(#clayBg)" filter="url(#shadow)"/>
  <rect x="4" y="4" width="88" height="44" rx="22" fill="rgba(255,255,255,0.15)"/>
  
  <!-- 奖杯 - 粘土风格 -->
  <g filter="url(#shadow)">
    <!-- 杯身 -->
    <path d="M28,22 h40 v16 c0,12 -10,20 -20,20 s-20,-8 -20,-20 v-16" fill="white"/>
    <!-- 杯柄 -->
    <path d="M28,26 h-6 c-5,0 -6,4 -6,8 c0,5 4,10 12,10" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <path d="M68,26 h6 c5,0 6,4 6,8 c0,5 -4,10 -12,10" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <!-- 底座 -->
    <rect x="44" y="58" width="8" height="10" rx="2" fill="white"/>
    <rect x="36" y="66" width="24" height="8" rx="4" fill="white"/>
  </g>
</svg>
