<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音效测试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        
        h2 {
            margin: 25px 0 15px;
            color: #ffd700;
            font-size: 1.5rem;
        }
        
        .sound-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .sound-btn {
            background: linear-gradient(145deg, #4c6ef5, #3b5bdb);
            border: none;
            border-radius: 12px;
            color: white;
            padding: 18px 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(76, 110, 245, 0.4);
        }
        
        .sound-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(76, 110, 245, 0.6);
            background: linear-gradient(145deg, #5c7cfa, #4c6ef5);
        }
        
        .sound-btn:active {
            transform: translateY(0);
        }
        
        .sound-btn.digit {
            background: linear-gradient(145deg, #51cf66, #40c057);
            box-shadow: 0 6px 20px rgba(81, 207, 102, 0.4);
        }
        
        .sound-btn.digit:hover {
            box-shadow: 0 10px 25px rgba(81, 207, 102, 0.6);
            background: linear-gradient(145deg, #69db7c, #51cf66);
        }
        
        .sound-btn.correct {
            background: linear-gradient(145deg, #ffd43b, #fab005);
            box-shadow: 0 6px 20px rgba(255, 212, 59, 0.4);
        }
        
        .sound-btn.correct:hover {
            box-shadow: 0 10px 25px rgba(255, 212, 59, 0.6);
            background: linear-gradient(145deg, #ffec99, #ffd43b);
        }
        
        .sound-btn.wrong {
            background: linear-gradient(145deg, #ff6b6b, #fa5252);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }
        
        .sound-btn.wrong:hover {
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.6);
            background: linear-gradient(145deg, #ff8787, #ff6b6b);
        }
        
        .sound-btn.win {
            background: linear-gradient(145deg, #cc5de8, #be4bdb);
            box-shadow: 0 6px 20px rgba(204, 93, 232, 0.4);
        }
        
        .sound-btn.win:hover {
            box-shadow: 0 10px 25px rgba(204, 93, 232, 0.6);
            background: linear-gradient(145deg, #da77f2, #cc5de8);
        }
        
        .note {
            font-size: 0.9rem;
            opacity: 0.8;
            font-weight: normal;
        }
        
        .control-panel {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: white;
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        
        .status h3 {
            margin-bottom: 10px;
            color: #a9e34b;
        }
        
        .info {
            margin-top: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        
        .info h3 {
            margin-bottom: 10px;
            color: #74c0fc;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .sound-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .sound-btn {
                padding: 15px 8px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 数学游戏音效测试</h1>
        
        <div class="info">
            <h3>📋 测试说明</h3>
            <p>这是一个简化的音效系统测试页面。所有音效都是程序生成的，使用纯净的三角波和正弦波，声音简单好听，适合儿童数学游戏。</p>
            <p>点击下方按钮测试各种音效，建议先点击"初始化音频"按钮。</p>
        </div>
        
        <div class="control-panel">
            <button class="control-btn" onclick="initAudio()">🎧 初始化音频</button>
            <button class="control-btn" onclick="testAllSounds()">▶️ 测试所有音效</button>
            <button class="control-btn" onclick="toggleSound()">🔊 切换音效开关</button>
        </div>
        
        <h2>数字键音效 (0-9)</h2>
        <div class="sound-grid">
            <button class="sound-btn digit" onclick="playDigit(0)">0 <span class="note">C5</span></button>
            <button class="sound-btn digit" onclick="playDigit(1)">1 <span class="note">D5</span></button>
            <button class="sound-btn digit" onclick="playDigit(2)">2 <span class="note">E5</span></button>
            <button class="sound-btn digit" onclick="playDigit(3)">3 <span class="note">F5</span></button>
            <button class="sound-btn digit" onclick="playDigit(4)">4 <span class="note">G5</span></button>
            <button class="sound-btn digit" onclick="playDigit(5)">5 <span class="note">A5</span></button>
            <button class="sound-btn digit" onclick="playDigit(6)">6 <span class="note">B5</span></button>
            <button class="sound-btn digit" onclick="playDigit(7)">7 <span class="note">C6</span></button>
            <button class="sound-btn digit" onclick="playDigit(8)">8 <span class="note">D6</span></button>
            <button class="sound-btn digit" onclick="playDigit(9)">9 <span class="note">E6</span></button>
        </div>
        
        <h2>功能键音效</h2>
        <div class="sound-grid">
            <button class="sound-btn" onclick="playClick()">点击 <span class="note">通用</span></button>
            <button class="sound-btn" onclick="playDelete()">删除 <span class="note">下滑音</span></button>
            <button class="sound-btn" onclick="playSubmit()">提交 <span class="note">双音上扬</span></button>
        </div>
        
        <h2>反馈音效</h2>
        <div class="sound-grid">
            <button class="sound-btn correct" onclick="playCorrect()">✅ 正确 <span class="note">上扬双音</span></button>
            <button class="sound-btn wrong" onclick="playWrong()">❌ 错误 <span class="note">下滑音</span></button>
        </div>
        
        <h2>胜利音效</h2>
        <div class="sound-grid">
            <button class="sound-btn win" onclick="playWin(1)">⭐ 1星</button>
            <button class="sound-btn win" onclick="playWin(2)">⭐⭐ 2星</button>
            <button class="sound-btn win" onclick="playWin(3)">⭐⭐⭐ 3星</button>
            <button class="sound-btn win" onclick="playWin(4)">⭐⭐⭐⭐ 4星</button>
            <button class="sound-btn win" onclick="playWin(5)">⭐⭐⭐⭐⭐ 5星</button>
        </div>
        
        <div class="status">
            <h3>📊 系统状态</h3>
            <div id="statusText">等待初始化...</div>
        </div>
    </div>

    <script type="module">
        // 导入音效系统
        import { useSound } from './src/composables/useSound.js'
        import { forceInitializeAudioContext, setMasterVolume } from './src/utils/audioContext.js'
        
        let soundSystem = null
        let soundEnabled = true
        
        // 初始化音效系统
        async function initAudio() {
            try {
                await forceInitializeAudioContext()
                
                // 创建音效系统实例
                soundSystem = useSound()
                
                // 设置音量
                setMasterVolume(0.7)
                
                updateStatus('✅ 音效系统初始化成功！')
                console.log('音效系统已初始化')
            } catch (error) {
                updateStatus('❌ 音效系统初始化失败: ' + error.message)
                console.error('初始化失败:', error)
            }
        }
        
        // 播放数字键音效
        function playDigit(digit) {
            if (!soundSystem || !soundEnabled) return
            soundSystem.playSound('click', { keyKind: 'digit', digit })
            updateStatus(`播放数字键: ${digit}`)
        }
        
        // 播放通用点击
        function playClick() {
            if (!soundSystem || !soundEnabled) return
            soundSystem.playSound('click', { keyKind: 'default' })
            updateStatus('播放通用点击音效')
        }
        
        // 播放删除键
        function playDelete() {
            if (!soundSystem || !soundEnabled) return
            soundSystem.playSound('click', { keyKind: 'delete' })
            updateStatus('播放删除键音效')
        }
        
        // 播放提交键
        function playSubmit() {
            if (!soundSystem || !soundEnabled) return
            soundSystem.playSound('click', { keyKind: 'submit' })
            updateStatus('播放提交键音效')
        }
        
        // 播放正确反馈
        function playCorrect() {
            if (!soundSystem || !soundEnabled) return
            soundSystem.playSound('correct')
            updateStatus('播放正确反馈音效')
        }
        
        // 播放错误反馈
        function playWrong() {
            if (!soundSystem || !soundEnabled) return
            soundSystem.playSound('wrong')
            updateStatus('播放错误反馈音效')
        }
        
        // 播放胜利音效
        function playWin(stars) {
            if (!soundSystem || !soundEnabled) return
            soundSystem.playSound('win', { stars })
            updateStatus(`播放 ${stars} 星胜利音效`)
        }
        
        // 测试所有音效
        async function testAllSounds() {
            if (!soundSystem || !soundEnabled) {
                updateStatus('请先初始化音频系统')
                return
            }
            
            updateStatus('开始测试所有音效...')
            
            // 延迟播放，让音效有间隔
            const sounds = [
                () => playDigit(5),
                () => playClick(),
                () => playDelete(),
                () => playSubmit(),
                () => playCorrect(),
                () => playWrong(),
                () => playWin(3)
            ]
            
            for (let i = 0; i < sounds.length; i++) {
                sounds[i]()
                await new Promise(resolve => setTimeout(resolve, 300))
            }
            
            updateStatus('所有音效测试完成！')
        }
        
        // 切换音效开关
        function toggleSound() {
            soundEnabled = !soundEnabled
            updateStatus(soundEnabled ? '🔊 音效已开启' : '🔇 音效已关闭')
        }
        
        // 更新状态显示
        function updateStatus(message) {
            const statusEl = document.getElementById('statusText')
            if (statusEl) {
                statusEl.textContent = message
            }
        }
        
        // 自动初始化
        window.addEventListener('click', function initOnFirstClick() {
            if (!soundSystem) {
                initAudio()
            }
            window.removeEventListener('click', initOnFirstClick)
        }, { once: true })
        
        // 导出到全局
        window.initAudio = initAudio
        window.playDigit = playDigit
        window.playClick = playClick
        window.playDelete = playDelete
        window.playSubmit = playSubmit
        window.playCorrect = playCorrect
        window.playWrong = playWrong
        window.playWin = playWin
        window.testAllSounds = testAllSounds
        window.toggleSound = toggleSound
        
        console.log('音效测试页面已加载')
    </script>
</body>
</html>
